version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/tarafirst_user_management
hooks:
  BeforeInstall:
    - location: scripts/install_dep.sh
      runas: root
  AfterInstall:
    - location: scripts/stop_containers.sh
      runas: root
  ApplicationStart:
    - location: scripts/start_containers.sh
      timeout: 600
      runas: root
